<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>상징사전 · 성경이야기</title><link rel="stylesheet" href="../common.css">
<style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box}
.sy{padding:10px 4px;border-bottom:1px solid var(--line)}.sy b{color:var(--accent)}.sy .w{color:var(--sub);font-size:.9rem;margin-top:4px}
td,th{vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}</style></head><body>
<script src="../menu.js"></script>
<div class="wrap"><section><h2>상징사전</h2>
<p class="sub">성경의 그림(상징)이 설교에서 무엇을 뜻했는지 가나다순으로 모았어요. 뜻은 설교자의 읽기예요.</p>
<input id="q" placeholder="검색 (예: 물, 7, 알레프)">
<div class="tabs" id="tabs"></div><div id="list"></div></section>
<script>
const D=[["빛", "nature", "말씀 안의 생명이고 어둠을 드러내는 것. 성도는 ‘세상의 빛’(마 5:14).", "29, 11", "포스 ← φαίνω 풀이는 설교자 읽기"], ["물", "nature", "아랫물(세상·문자)과 윗물(말씀·성령)의 쌍. 마라의 쓴물 → 단물이 율법의 목적.", "30, 49", "마임은 형태만 쌍수, 의미는 복수가 통설"], ["불", "nature", "하나님이 나타나시는 그림(떨기나무·오순절). 심판과 연단의 얼굴도 있음.", "31, 32, 38", ""], ["씨(제라)", "nature", "약속. 갈 3:16의 단수 ‘씨’는 그리스도.", "33", ""], ["무지개", "nature", "‘활(케셰트)’. 걸린 활은 죽음을 담보한 약속.", "33", "모래(홀) = 고통은 민간어원"], ["남자와 여자", "nature", "남자(자카르)는 씨를 가진 존재, 여자(네케바)는 씨를 받는 밭. 그리스도와 교회의 그림.", "34", ""], ["결혼", "nature", "하나님과 사람의 연합 그림. 예복은 그리스도로 입혀 주심.", "35", ""], ["선악지식나무·생명나무", "nature", "창 2장의 ‘나무’는 단수. 하나의 말씀을 문자(죽임)로 먹느냐 영(살림)으로 먹느냐.", "36", "‘실과’는 원문에 없음"], ["상수리나무(엘론)", "nature", "하나님/진리 나무. 아브라함이 그 아래 제단을 쌓음.", "37", "엘론 = 엘 풀이는 설교자 해석"], ["가시나무(시타)", "nature", "고통의 나무(사람). 금(영광)을 입혀 성막이 됨.", "38", "시타 ↔ 사탄은 민간어원"], ["종려·백향목", "nature", "종려는 심으심으로 의인이 된 존재, 백향목은 제국의 상징.", "38", ""], ["올리브·무화과", "nature", "올리브는 기름(성령)이 되는 생명나무 계열, 무화과는 선악나무 계열.", "39", "무화과는 왕상 4:25처럼 긍정 상징도 있음"], ["포도나무·십자가(스타우로스)", "nature", "모든 나무의 집약이 십자가. 갈 2:20.", "40", "범신론처럼 들리지 않게 주의"], ["뱀", "nature", "지혜(아룸)와 간교의 이중성. 불뱀(죽임)과 놋뱀(살림)은 한 쌍.", "18-2, 46", ""], ["놋·은·금", "nature", "놋 = 심판, 은 = 구속, 금 = 영광(카보드, ‘무겁다’).", "45, 38", "금속 상징은 설교자 해석"], ["1", "num", "하나님·하나됨. 모든 숫자는 결국 ‘하나(에하드)’로.", "14, 23", ""], ["2", "num", "나뉨과 짝(두 증인). 하나가 되지 못하면 대적의 수.", "14", ""], ["3", "num", "드러남(죽음과 부활). 삼일 길, 셋째 하늘(지성소).", "15", ""], ["4", "num", "하늘의 뜻이 땅에 드러나는 수. 동서남북, 40은 시험.", "16", ""], ["5", "num", "율법·고통이면서 은혜의 숫자.", "17", "리워야단 ↔ 레위는 민간어원"], ["6", "num", "사람의 숫자·만남의 숫자. 666은 ‘사람의 수’.", "18, 19", "일부 사본은 616"], ["7", "num", "안식이 아니라 완성을 위한 전쟁(성령의 검).", "21", "샤바트 = 샤바(맹세) 풀이는 말놀이에 가까움"], ["8", "num", "새 생명·부활. 8일째 할례, 노아 가족 8명.", "21", ""], ["9", "num", "열매(성령의 열매·은사).", "21", ""], ["10", "num", "열 말씀의 충만.", "21, 24", ""], ["12", "num", "하나님의 아들들(3×4).", "22", ""], ["70", "num", "7이 10으로 펼쳐진 열방.", "22", ""], ["144,000", "num", "인원수가 아니라 성막과 진영(12×12)이 하나님의 다스림으로 표현된 상태.", "22", "설교자 해석"], ["알레프 א", "heb", "소 머리 — 힘·으뜸·1·천.", "41, 42", ""], ["베트 ב", "heb", "집 = 아들 = 성전.", "42, 43", ""], ["김멜 ג", "heb", "낙타 — 광야를 건너는 길. 가말 = 젖을 떼다·성숙하다.", "43", ""], ["달렛 ד", "heb", "장막의 문 — 진리로 들어가는 길(요 10:9, 14:6).", "44", ""], ["헤 ה", "heb", "숨구멍·창문·‘보라’.", "44", ""], ["바브 ו", "heb", "휘장을 고정하는 갈고리(못) — 연결.", "45", ""], ["자인 ז", "heb", "쟁기·검 — 성령의 검 = 말씀.", "45, 21", ""], ["헤트 ח", "heb", "울타리 — 생명(하이).", "46", "ח = ו + ז 풀이는 근거 약함"], ["테트 ט", "heb", "뱀·지혜·좋음(토브).", "46", ""], ["요드 י", "heb", "가장 작은 글자·10·‘하나님의 손’.", "47", ""], ["카프 כ", "heb", "손바닥·그릇 — 영광을 담는 그릇.", "48", ""], ["라메드 ל", "heb", "목자의 지팡이 — 배움·제자·인도.", "48", "카프 + 바브 합자 풀이는 근거 약함"], ["멤 מ", "heb", "물(마임).", "49", ""], ["눈 נ", "heb", "물고기·번식.", "50", "다곤 어원은 불확실"], ["싸메크 ס", "heb", "뼈대·붙듦. 눈과 합쳐 네스(깃발).", "50", ""], ["아인 ע", "heb", "눈·샘 — ‘본다’는 깨달아 앎.", "51", ""], ["페 פ", "heb", "입 — 말은 마음의 열매.", "51", ""], ["차데 צ", "heb", "낚시 — 낚는 목적은 의인(짜디크).", "52", "글자 그림은 이설이 있음"], ["코프 ק", "heb", "도끼 — 구별 = 거룩(카도쉬).", "52", ""], ["레쉬 ר", "heb", "머리 — 시작·근원(로쉬).", "53", ""], ["쉰·신 ש", "heb", "이빨 — 말씀을 곱씹음.", "53", ""], ["타브 ת", "heb", "두 막대가 겹친 표(십자).", "54", "창 4:15 ‘표’는 가인이 보호받는 읽기가 자연스러움"]];const C={all:"전체",nature:"자연 그림",num:"숫자",heb:"히브리 자음"};let cat="all";
const tabs=document.getElementById("tabs"),list=document.getElementById("list"),q=document.getElementById("q");
for(const k in C){const b=document.createElement("button");b.textContent=C[k];b.onclick=()=>{cat=k;render()};b.dataset.k=k;tabs.appendChild(b)}
function render(){const t=q.value.trim();[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k==cat));
list.innerHTML=D.filter(d=>(cat=="all"||d[1]==cat)&&(!t||(d[0]+d[2]).includes(t))).sort((a,b)=>a[0].localeCompare(b[0],"ko")).map(d=>
'<div class="sy"><b>'+d[0]+'</b> <span class="o">· 테마 '+d[3]+'</span><div>'+d[2]+'</div>'+(d[4]?'<div class="w">⚠️ '+d[4]+'</div>':'')+'</div>').join("")||"<p>결과가 없어요.</p>"}
q.oninput=render;render();
</script>
<footer>하나사랑교회 설교 영상(유튜브 자막)을 바탕으로 정리했어요. 설교자의 해석이며 다른 해석도 있을 수 있어요.</footer></div>
</body></html>
