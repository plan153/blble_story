<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>원어 근거 점검 · 성경이야기</title><link rel="stylesheet" href="../common.css">
<style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box}
.sy{padding:10px 4px;border-bottom:1px solid var(--line)}.sy b{color:var(--accent)}.sy .w{color:var(--sub);font-size:.9rem;margin-top:4px}
td,th{vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}</style></head><body>
<script src="../menu.js"></script>
<div class="wrap"><section><h2>원어 근거 점검</h2>
<p class="sub">설교에서 나온 원어 주장을 원문 사실과 설교자 해석으로 나눠 정리했어요. 글자 풀이와 숫자 풀이는 신앙의 결론이 아니라 읽기의 한 방법이에요.</p>
<input id="q" placeholder="검색 (예: 에트, 666, 샤마임)">
<table><thead><tr><th>주장</th><th>원문 사실</th><th>설교자 해석</th><th>테마</th></tr></thead><tbody id="b"></tbody></table></section>
<script>
const R=[["엘로힘의 -임은 둘(짝)을 뜻한다", "남성 복수형이지 쌍수가 아니에요.", "‘짝’은 상징 풀이", "7"], ["에트(אֵת)는 ‘목적’이다", "목적격 표지일 뿐 ‘목적(뜻)’과 무관한 동음이에요.", "알레프~타브 = 처음과 끝, 하나님의 목적", "42"], ["에트의 게마트리아는 8이다", "알레프 1 + 타브 400 = 401이에요.", "8 = 부활 연결", "46"], ["샤마임 = 샴 + 마임(거기 물)", "민간어원이에요. 쌍수형이라는 점은 문법상 사실이에요.", "하늘에는 물이 있다", "10, 30"], ["마임·샤마임은 쌍수라서 ‘쌍’을 뜻한다", "형태만 쌍수이고 의미는 복수라는 게 학계 통설이에요.", "아랫물/윗물 한 쌍", "30, 49"], ["창 1:5 ‘첫째 날’은 ‘하나의 날’이다", "원문은 욤 에하드(기수)가 맞아요. 다만 ‘첫째 날’로 옮기는 것도 문법상 가능해요.", "7일 전체가 하나의 날", "23"], ["창 2:2는 ‘일곱째 날’에 마치셨다", "마소라 본문은 일곱째 날이 맞아요(칠십인역·사마리아 오경은 여섯째 날).", "안식 = 완성", "21"], ["샤바트(안식) = 샤바(맹세)", "말놀이에 가까워요.", "안식 = 맹세의 완성", "11, 21, 26"], ["‘주일’은 가톨릭이 만든 말이다", "계 1:10 ‘주의 날’이 있어서 사실과 달라요.", "주일 용어 비판", "26"], ["창 4:15 가인의 표는 낙인이다", "가인이 보호받는 읽기가 문법상 자연스러워요.", "표 = 낙인", "54"], ["요 21:11의 153은 의도된 숫자다", "계산(1~17의 합)은 맞지만 저자 의도는 증명되지 않아요.", "153 = 의인(아들들)", "52, 54"], ["계 13:18의 666은 ‘사람의 수’다", "‘셈하라’는 명령이고, 일부 사본은 616이에요.", "666 = 뱀·사탄·거짓 예수", "18, 19"], ["χάραγμα와 χάραξ를 이어 풀 수 있다", "근거가 약해요.", "666 풀이", "18"], ["시타(가시나무) ↔ 사탄", "민간어원이에요. 떨기나무(세네)는 다른 단어예요.", "가시나무 = 고통·사탄", "38"], ["리워야단 ↔ 레위", "민간어원이에요.", "이중성", "17"], ["모래(홀) = 고통", "민간어원이에요.", "별/모래 = 이삭/이스마엘", "33"], ["히브리어 이웃(레아) = 악(라)", "서로 다른 어근이에요.", "이웃과 악을 한 줄로 풀이", "28"], ["다곤 = 물고기 신", "다그(물고기)설과 다간(곡식)설이 갈려요. 스타벅스 연결은 근거가 없어요.", "풍요·번영의 신", "50"], ["모로스 ← 미스테리온", "별도 어근이에요. 연결 근거 없음.", "소금 = 지혜", "46"], ["ח = ו + ז, ל = כ + ו (합자)", "그런 학설은 없어요. 모양 풀이예요.", "글자 합성 풀이", "46, 48"], ["첼렘 = 나타난 것 / 데무트 = 보이지 않는 것", "학계는 둘을 거의 평행어로 봐요.", "이분법 구분", "48"], ["바르(순결) = 바르(아들)", "동음이의어예요(히브리어 / 아람어).", "청결한 마음 = 아들의 그릇", "48"], ["요 3:3 ἄνωθεν = 위로부터", "‘다시’와 ‘위로부터’ 이중 의미가 가능해요.", "위로부터 거듭남", "49"], ["요 11:26 ‘카이’ = 곧", "카이에 ‘곧’ 용법이 있는 건 사실이에요.", "살아 있는 자 곧 믿는 자", "37"], ["요 1:1 아르케·ἦν = 영원한 존재 방식", "ἦν은 미완료로 ‘계속된 상태’가 사실이에요. 아르케를 ‘근원’으로 읽는 것도 가능해요.", "존재의 근원", "53"], ["베레쉬트의 베(ב)는 ‘집’이다", "베는 전치사 ‘~안에’예요. ‘집 + 머리’는 말놀이예요.", "머리가 거하는 집", "43, 53"], ["靈·魂 한자가 무속 기원이라 ‘영’ 번역이 오해를 낳는다", "한자 자원학의 한 설이에요.", "영 = 숨·바람", "53"], ["갈 3:24 파이다고고스 = 아이를 인도하는 종", "원래 의미는 사실이에요(몽학선생).", "율법 아래 = 아이들", "27"], ["마 1:17 14대 = 다윗(דוד)의 숫자값", "마태 계보 구조를 이렇게 설명하는 학설이 있어요.", "그리스도는 다윗의 후손", "50"], ["고전 10:11은 ‘모형(튀포스)’을 보증한다", "원문은 튀피코스(본보기로)이고, 히 8:5는 휘포데이그마예요.", "모형 이론", "2"], ["아룸(간교·슬기) ↔ 에롬(벌거벗음)", "창 3:1, 3:7의 말놀이는 사실이에요.", "뱀의 지혜 = 자기를 보게 함", "18-2, 51"], ["하슈크 = 달라붙다·사랑하다", "사전적 사실이에요.", "기둥을 사랑으로 묶음", "45"], ["‘내가 숨 쉬는 게 아니라 하나님이 숨 쉬신다’", "범신론처럼 들릴 수 있어 주의가 필요해요(시편·욥기의 ‘숨을 주심’과 구분).", "일원론적 표현", "40, 52"], ["엘림의 열둘 샘·일흔 종려 = 7·10·12", "본문 사실(출 15:27)이고 숫자 상징은 해석이에요.", "구속사 전체", "22"]];const b=document.getElementById("b"),q=document.getElementById("q");
function render(){const t=q.value.trim();b.innerHTML=R.filter(r=>!t||r.join(" ").includes(t)).map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")}
q.oninput=render;render();
</script>
<footer>하나사랑교회 설교 영상(유튜브 자막)을 바탕으로 정리했어요. 설교자의 해석이며 다른 해석도 있을 수 있어요.</footer></div>
</body></html>
